<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>罗涵篇 ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
font-family:sans-serif;
background:#090909;
color:white;
}

/* 背景 */
#bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at top,#1d2330,#090909 70%);
transition:1s;
}

/* 星空 */
.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation: twinkle 2s infinite;
}

@keyframes twinkle{
0%,100%{opacity:.2}
50%{opacity:1}
}

/* 对话框 */
#dialog{
position:absolute;
left:50%;
bottom:40px;
transform:translateX(-50%);
width:85%;
background:rgba(255,255,255,0.08);
backdrop-filter: blur(10px);
border-radius:24px;
padding:26px;
box-shadow:0 10px 40px rgba(0,0,0,.5);
}

#name{
font-size:18px;
opacity:.7;
margin-bottom:10px;
}

#text{
font-size:30px;
line-height:1.7;
min-height:120px;
animation: fade .6s;
}

/* 按钮 */
#choices{
margin-top:20px;
display:flex;
gap:15px;
flex-wrap:wrap;
}

.choice{
padding:12px 24px;
border:none;
border-radius:999px;
background:rgba(255,255,255,.12);
color:white;
font-size:16px;
transition:.3s;
cursor:pointer;
}

.choice:hover{
transform:scale(1.08);
background:rgba(255,255,255,.2);
}

/* 小猫 */
#cat{
position:fixed;
right:20px;
bottom:220px;
font-size:60px;
animation: float 2s infinite;
}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(-8px)}
100%{transform:translateY(0)}
}

/* 标题 */
#tip{
position:fixed;
top:40px;
left:50%;
transform:translateX(-50%);
font-size:18px;
opacity:.6;
letter-spacing:3px;
}

/* 爱心 */
.heart{
position:fixed;
color:#ff4d6d;
font-size:20px;
animation:fall linear forwards;
}

@keyframes fall{
to{
transform:translateY(110vh);
opacity:0;
}
}

.fade{
animation: fade .6s;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(15px);
}
}

</style>
</head>

<body>

<div id="bg"></div>
<div id="tip">《 罗涵篇 》</div>
<div id="cat">🐱</div>

<div id="dialog">
<div id="name">故事开始了</div>
<div id="text">点一下，故事开始。</div>
<div id="choices"></div>
</div>

<script>

// ⭐ 星空
for(let i=0;i<90;i++){
const s=document.createElement('div');
s.className='star';
s.style.left=Math.random()*100+'vw';
s.style.top=Math.random()*100+'vh';
s.style.animationDelay=Math.random()*2+'s';
document.body.appendChild(s);
}

// ❤️ 爱心
setInterval(()=>{
const h=document.createElement('div');
h.className='heart';
h.innerText='❤';
h.style.left=Math.random()*100+'vw';
h.style.top='-20px';
h.style.animationDuration=(4+Math.random()*4)+'s';
document.body.appendChild(h);
setTimeout(()=>h.remove(),8000);
},800);

const text=document.getElementById('text');
const nameEl=document.getElementById('name');
const choices=document.getElementById('choices');

let step=0;

const story=[
{
name:'旁白',
text:'有时候我会觉得，缘分真的很奇怪。'
},
{
name:'旁白',
text:'原本只是聊天软件里很普通的一次对话。'
},
{
name:'我',
text:'但不知道为什么，和你聊天的时候，总感觉时间过得特别快。'
},
{
name:'🐱 小猫',
text:'有人已经偷偷上头了喔～'
},
{
name:'旁白',
text:'后来到了五一，我们终于决定见面。'
},
{
name:'旁白',
text:'那天的风有点大，但我记得你笑起来很好看。'
},
{
name:'旁白',
text:'我们一起去了桌游店。'
},
{
name:'我',
text:'其实那时候我有点紧张。',
choices:['怕冷场','怕你觉得我无聊','但还是很开心']
},
{
name:'旁白',
text:'后来又一起喝酒喝到了凌晨。'
},
{
name:'旁白',
text:'明明才刚认识，却像认识了很久。'
},
{
name:'🐱 小猫',
text:'微醺 + 心动 = 完蛋啦。'
},
{
name:'旁白',
text:'第二天，我们去了欢乐谷。'
},
{
name:'旁白',
text:'你玩得特别开心。'
},
{
name:'我',
text:'而我已经快晕过去了。'
},
{
name:'🐱 小猫',
text:'他都快碎掉了还在陪你玩。'
},
{
name:'旁白',
text:'第三天，我们去洗了脚。'
},
{
name:'旁白',
text:'后来我还给你带了花。'
},
{
name:'我',
text:'其实送花的时候，我比想象中紧张很多。'
},
{
name:'旁白',
text:'最后，我们一起去了KTV。'
},
{
name:'旁白',
text:'灯光有点暗，歌声有点温柔。'
},
{
name:'我',
text:'那时候我就在想。'
},
{
name:'我',
text:'以后是不是还能继续陪你一起玩。',
choices:['当然可以','看你表现','那要加油喔']
},
{
name:'🐱 小猫',
text:'他真的很认真欸。'
},
{
name:'旁白',
text:'其实有些话，我一直没太敢说。'
},
{
name:'我',
text:'但我真的很开心，能遇见你。'
},
{
name:'我',
text:'❤️'
}
];

function render(){

choices.innerHTML='';

if(step>=story.length){
nameEl.innerText='故事结束';
text.innerHTML='未完待续… ❤️';
return;
}

const s=story[step];

nameEl.innerText=s.name;

text.classList.remove('fade');
void text.offsetWidth;
text.classList.add('fade');

text.innerText=s.text;

if(s.choices){

s.choices.forEach(c=>{

const btn=document.createElement('button');

btn.className='choice';

btn.innerText=c;

btn.onclick=()=>{
step++;
render();
};

choices.appendChild(btn);

});

}else{

const btn=document.createElement('button');

btn.className='choice';

btn.innerText='继续';

btn.onclick=()=>{
step++;
render();
};

choices.appendChild(btn);

}

}

render();

</script>

</body>
</html>
