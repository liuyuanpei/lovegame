<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>罗涵篇 ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
font-family:'Noto Sans SC',sans-serif;
background:#0a0d16;
color:white;
}

/* 背景 */

#bg{
position:fixed;
inset:0;
background:
linear-gradient(to bottom,#12192d,#090b12);
overflow:hidden;
}

/* 星空 */

.star{
position:absolute;
background:white;
border-radius:50%;
opacity:.7;
animation:twinkle 3s infinite;
}

@keyframes twinkle{
0%,100%{opacity:.2}
50%{opacity:1}
}

/* 月亮 */

#moon{
position:absolute;
right:90px;
top:70px;
width:130px;
height:130px;
border-radius:50%;
background:#fff5da;
box-shadow:0 0 80px rgba(255,255,255,.5);
}

/* 标题 */

#title{
position:absolute;
left:50%;
top:35px;
transform:translateX(-50%);
font-size:34px;
font-family:'ZCOOL KuaiLe',cursive;
letter-spacing:4px;
}

/* 左侧章节 */

#menu{
position:absolute;
left:20px;
top:120px;
display:flex;
flex-direction:column;
gap:12px;
z-index:10;
}

.chapter{
width:150px;
padding:14px;
border-radius:18px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
font-size:17px;
transition:.3s;
cursor:pointer;
}

.chapter:hover{
transform:scale(1.05);
background:rgba(255,255,255,.14);
}

/* 主立绘 */

#main{
position:absolute;
left:50%;
top:48%;
transform:translate(-50%,-50%);
display:flex;
align-items:flex-end;
gap:30px;
z-index:2;
}

.character{
font-size:250px;
animation:float 3s infinite;
filter:drop-shadow(0 10px 30px rgba(0,0,0,.5));
user-select:none;
}

#girl{
animation-delay:.8s;
}

@keyframes float{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-12px);
}
}

/* Q版 */

.chibi{
position:absolute;
bottom:20px;
font-size:110px;
animation:float 2s infinite;
}

#c1{
left:30px;
}

#c2{
right:30px;
animation-delay:.7s;
}

/* 猫 */

#cat{
position:absolute;
right:140px;
bottom:170px;
font-size:80px;
animation:float 2s infinite;
}

#catBubble{
position:absolute;
right:230px;
bottom:260px;
background:rgba(255,255,255,.12);
padding:14px 18px;
border-radius:20px;
font-size:15px;
opacity:0;
transition:.4s;
backdrop-filter:blur(10px);
}

/* 对话框 */

#dialog{
position:absolute;
left:50%;
bottom:35px;
transform:translateX(-50%);
width:78%;
max-width:1100px;
background:rgba(18,20,34,.7);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.08);
border-radius:30px;
padding:35px;
box-shadow:0 10px 40px rgba(0,0,0,.45);
z-index:20;
}

/* 名字 */

#name{
font-size:26px;
color:#ffcae0;
margin-bottom:14px;
font-weight:700;
}

/* 文本 */

#text{
font-size:42px;
line-height:1.8;
min-height:170px;
font-weight:600;
animation:fade .5s;
}

/* 动画 */

@keyframes fade{
from{
opacity:0;
transform:translateY(15px);
}
}

/* 选项 */

#choices{
margin-top:25px;
display:flex;
flex-direction:column;
gap:15px;
}

.choice{
border:none;
padding:18px 22px;
font-size:23px;
border-radius:22px;
background:rgba(255,255,255,.08);
color:white;
text-align:left;
transition:.3s;
cursor:pointer;
backdrop-filter:blur(10px);
}

.choice:hover{
transform:translateX(10px) scale(1.02);
background:rgba(255,255,255,.15);
}

/* 爱心 */

.heart{
position:fixed;
top:-20px;
color:#ff7aa2;
animation:fall linear forwards;
pointer-events:none;
}

@keyframes fall{
to{
transform:translateY(110vh);
opacity:0;
}
}

/* 进度 */

#progress{
position:absolute;
top:40px;
right:40px;
font-size:18px;
opacity:.7;
}

/* 自动打字 */

.typing{
border-right:3px solid white;
animation:blink .7s infinite;
}

@keyframes blink{
50%{
border-color:transparent;
}
}

</style>
</head>

<body>

<div id="bg"></div>

<div id="moon"></div>

<div id="title">《 罗涵篇 ❤️ 》</div>

<div id="progress">故事进度 1 / 28</div>

<!-- 左侧章节 -->

<div id="menu">

<div class="chapter">💬 初次聊天</div>
<div class="chapter">🎲 第一次见面</div>
<div class="chapter">🍺 喝到凌晨</div>
<div class="chapter">🎡 欢乐谷</div>
<div class="chapter">🌹 送你的花</div>
<div class="chapter">🎤 KTV的夜晚</div>

</div>

<!-- 主人物 -->

<div id="main">

<div id="boy" class="character">🧑🏻</div>

<div id="girl" class="character">👧🏻</div>

</div>

<!-- Q版 -->

<div id="c1" class="chibi">🥺</div>
<div id="c2" class="chibi">🌸</div>

<!-- 猫 -->

<div id="cat">🐱</div>
<div id="catBubble">他们真的好配哦～</div>

<!-- 对话框 -->

<div id="dialog">

<div id="name">旁白</div>

<div id="text"></div>

<div id="choices"></div>

</div>

<script>

/* 星空 */

for(let i=0;i<120;i++){

const s=document.createElement('div');

s.className='star';

let size=Math.random()*3;

s.style.width=size+'px';
s.style.height=size+'px';

s.style.left=Math.random()*100+'vw';
s.style.top=Math.random()*100+'vh';

s.style.animationDelay=Math.random()*3+'s';

document.getElementById('bg').appendChild(s);

}

/* 爱心 */

setInterval(()=>{

const h=document.createElement('div');

h.className='heart';

h.innerText='❤';

h.style.left=Math.random()*100+'vw';

h.style.fontSize=(12+Math.random()*20)+'px';

h.style.animationDuration=(4+Math.random()*4)+'s';

document.body.appendChild(h);

setTimeout(()=>h.remove(),8000);

},600);

/* 猫说话 */

const catTexts=[
"他真的超喜欢你。",
"我觉得你们很般配欸。",
"其实她也心动了吧。",
"这个氛围也太甜了。",
"今天也是恋爱的一天。"
];

function catTalk(){

const el=document.getElementById('catBubble');

el.innerText=catTexts[Math.floor(Math.random()*catTexts.length)];

el.style.opacity=1;

setTimeout(()=>{
el.style.opacity=0;
},2500);

}

setInterval(catTalk,5000);

/* 剧情 */

const story=[

{
name:"旁白",
text:"有时候我会觉得，缘分真的很奇怪。",
choices:["继续"]
},

{
name:"旁白",
text:"原本只是聊天软件里很普通的一句“你好”。",
choices:["然后呢"]
},

{
name:"我",
text:"但不知道为什么，和你聊天的时候，总感觉时间过得特别快。",
choices:["我也是"]
},

{
name:"👧🏻 你",
text:"可能因为你话太多了。",
choices:["那你还陪我聊"]
},

{
name:"🐱 小猫",
text:"其实她聊得也很开心啦。",
choices:["继续"]
},

{
name:"旁白",
text:"后来到了五一，我们终于决定见面。",
choices:["继续"]
},

{
name:"旁白",
text:"那天风有点大。",
choices:["继续"]
},

{
name:"旁白",
text:"但我还是一眼就看见了你。",
choices:["笨蛋"]
},

{
name:"旁白",
text:"然后我们一起去了桌游店。",
choices:["继续"]
},

{
name:"我",
text:"其实那时候我有点紧张。",
choices:[
"怕冷场",
"怕你觉得我无聊",
"但还是特别开心"
]
},

{
name:"👧🏻 你",
text:"其实我也有一点点。",
choices:["真的吗"]
},

{
name:"旁白",
text:"后来我们又一起喝酒喝到了凌晨。",
choices:["继续"]
},

{
name:"旁白",
text:"街边灯光很亮。",
choices:["继续"]
},

{
name:"旁白",
text:"明明才刚认识。",
choices:["继续"]
},

{
name:"旁白",
text:"却像已经认识了很久。",
choices:["我也觉得"]
},

{
name:"🐱 小猫",
text:"微醺的时候最容易心动啦。",
choices:["继续"]
},

{
name:"旁白",
text:"第二天，我们去了欢乐谷。",
choices:["继续"]
},

{
name:"👧🏻 你",
text:"我那天真的玩得特别开心。",
choices:["你开心就好"]
},

{
name:"我",
text:"而我已经快晕过去了。",
choices:["哈哈哈哈"]
},

{
name:"🐱 小猫",
text:"他都快碎掉了还在陪你玩。",
choices:["继续"]
},

{
name:"旁白",
text:"第三天，我们一起去洗了脚。",
choices:["继续"]
},

{
name:"旁白",
text:"后来我还偷偷给你带了花。",
choices:["🌹"]
},

{
name:"我",
text:"其实递花的时候，我比想象中还紧张。",
choices:[
"你做得很好，我很喜欢。",
"笨蛋，谁不喜欢花呀。",
"下次还要送吗？"
]
},

{
name:"👧🏻 你",
text:"但我真的很喜欢。",
choices:["继续"]
},

{
name:"旁白",
text:"最后，我们一起去了KTV。",
choices:["🎤"]
},

{
name:"旁白",
text:"灯光有点暗。",
choices:["继续"]
},

{
name:"旁白",
text:"歌声也很温柔。",
choices:["继续"]
},

{
name:"我",
text:"那时候我就在想。",
choices:["想什么"]
},

{
name:"我",
text:"以后是不是还能继续陪你一起玩。",
choices:[
"当然可以",
"那要看你表现",
"笨蛋，当然可以"
]
},

{
name:"🐱 小猫",
text:"有人已经彻底沦陷啦。",
choices:["❤️"]
}

];

let step=0;

const nameEl=document.getElementById('name');
const textEl=document.getElementById('text');
const choicesEl=document.getElementById('choices');
const progress=document.getElementById('progress');

function typeWriter(text,callback){

textEl.innerHTML='';

let i=0;

const timer=setInterval(()=>{

textEl.innerHTML=text.slice(0,i)+'<span class="typing"></span>';

i++;

if(i>text.length){

clearInterval(timer);

textEl.innerHTML=text;

if(callback) callback();

}

},35);

}

function render(){

choicesEl.innerHTML='';

const s=story[step];

progress.innerText=`故事进度 ${step+1} / ${story.length}`;

nameEl.innerText=s.name;

typeWriter(s.text,()=>{

s.choices.forEach(c=>{

const btn=document.createElement('button');

btn.className='choice';

btn.innerText=c;

btn.onclick=()=>{

step++;

if(step>=story.length){

nameEl.innerText='故事结束';

textEl.innerHTML='未完待续… ❤️';

choicesEl.innerHTML='';

return;

}

render();

};

choicesEl.appendChild(btn);

});

});

}

render();

</script>

</body>
</html>
